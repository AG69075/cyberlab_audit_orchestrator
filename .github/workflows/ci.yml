name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Sur main, on ne coupe jamais un run en cours (évite un publish interrompu).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: audit-orchestrator:ci
  # Trivy 0.74.0, épinglé par digest (comme les images de base des Dockerfile).
  TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  COSIGN: gcr.io/projectsigstore/cosign@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build de l'image
        run: docker build -t "$IMAGE" .

      - name: Démarrage avec le durcissement de prod
        # Mêmes contraintes que le docker-compose du NAS : rootfs en lecture
        # seule, aucune capability, /tmp en noexec. Token factice : aucun secret.
        run: |
          docker run -d --name smoke \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e INTERNAL_API_TOKEN=ci-test-token \
            -p 127.0.0.1:4003:4003 "$IMAGE"

      - name: HEALTHCHECK Docker
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          docker logs smoke
          exit 1

      - name: /health répond 200
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4003/health)
          test "$code" = 200

      - name: /api/audit refuse sans token (401)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'content-type: application/json' -d '{"target":"example.com"}' \
            http://127.0.0.1:4003/api/audit)
          test "$code" = 401

      - name: Avec token, la cible invalide est rejetée par la validation (400)
        # Reste déterministe : n'envoie aucune requête vers Internet.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'x-internal-token: ci-test-token' -H 'content-type: application/json' \
            -d '{}' http://127.0.0.1:4003/api/audit)
          test "$code" = 400

      - name: Logs du conteneur (en cas d'échec)
        if: failure()
        run: docker logs smoke

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dépendances, secrets et Dockerfile (bloquant)
        run: |
          docker run --rm -v "$PWD":/src "$TRIVY" fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --skip-dirs node_modules --exit-code 1 /src

      - name: Build de l'image
        run: docker build -t "$IMAGE" .

      - name: Paquets OS de l'image (bloquant, correctifs disponibles)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: npm intégré à l'image de base (informatif)
        # Ces paquets sont ceux de l'outil npm livré dans node:22-slim, pas ceux
        # de l'app ; ils se corrigent en changeant l'image de base. Non bloquant.
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --pkg-types library --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE"

  # Publie l'image validée : uniquement sur push main, une fois les 3 gates verts.
  # Ne déploie rien : le déploiement reste géré par le pipeline Ansible du repo
  # Cyberlab_backends, qui référence l'image par digest.
  publish:
    needs: [lint, build-and-smoke-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push sur GHCR
      id-token: write   # signature Cosign sans clé (OIDC GitHub)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build et push (tag = SHA du commit)
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$REPO:${{ github.sha }}" .
          docker push "$REPO:${{ github.sha }}"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPO:${{ github.sha }}")
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Signature Cosign (sans clé, via OIDC)
        run: |
          docker run --rm \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e DOCKER_CONFIG=/dockercfg \
            -v "$HOME/.docker":/dockercfg:ro \
            "$COSIGN" sign --yes "$DIGEST"

      - name: Digest à reporter dans le compose
        run: |
          {
            echo "### Image publiée et signée"
            echo
            echo "\`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # A ajouter a la fin du job publish de chaque backend (meme bloc partout).
      # Ouvre une PR sur Cyberlab_backends qui remplace le digest dans le
      # compose. Secret requis dans le depot backend : CYBERLAB_BACKENDS_TOKEN
      # (PAT fine-grained limite a Cyberlab_backends : Contents + Pull requests en ecriture).
      - name: PR de bump du digest dans Cyberlab_backends
        env:
          GH_TOKEN: ${{ secrets.CYBERLAB_BACKENDS_TOKEN }}
          TARGET: NAS-HomeServer/Cyberlab_backends
        run: |
          set -euo pipefail
          NAME="${GITHUB_REPOSITORY##*/}"
          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH="bump/${NAME}-${GITHUB_SHA::7}"
          gh auth setup-git
          gh repo clone "$TARGET" backends -- --depth 1
          cd backends
          sed -i -E "s|${BASE}@sha256:[a-f0-9]{64}|${DIGEST}|" cyberlab/docker-compose.yml
          if git diff --quiet; then
            echo "Digest deja a jour, rien a faire."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "deploy: ${NAME} -> ${GITHUB_SHA::7} (image signee)"
          git push origin "$BRANCH"
          gh pr create --repo "$TARGET" --base main --head "$BRANCH" \
            --title "deploy: ${NAME} -> ${GITHUB_SHA::7}" \
            --body "Nouvelle image signee : \`${DIGEST}\`. Source : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"